[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "aciClient"
version = "2.0.0"
description = "ACI communication helper class"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
  { name = "Netcloud AG", email = "nc_dev@netcloud.ch" },
]
dependencies = [
  "certifi>=2026.10.19",
  "cryptography>=50.0.2,<51",
  "httpx[socks]>=0.27,<1",
  "pyOpenSSL>=26.4.0,<27",
  "requests[socks]>=2.33.1,<3",
  "urllib3>=2.8.0,<3",
]
classifiers = [
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/netcloud/aciClient"
Repository = "https://github.com/netcloud/aciClient"
Issues = "https://github.com/netcloud/aciClient/issues"
Documentation = "https://github.com/netcloud/aciClient/blob/master/README.md"

[dependency-groups]
dev = [
  "pytest>=9.0.2,<10",
  "requests-mock>=1.12.1,<2",
  "ruff>=0.13.0,<0.16",
]

[tool.setuptools]
packages = ["aciClient"]

[tool.setuptools.package-data]
aciClient = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["test"]

[tool.ruff]
target-version = "py312"
